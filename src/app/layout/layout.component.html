<div class="main-layout">

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="!isSidebarOpen">

    <div class="sidebar-logo">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 21V8l9-5 9 5v13" />
        <path d="M9 21V12h6v9" />
      </svg>
      <span class="logo-text" *ngIf="isSidebarOpen">GATE MANAGEMENT</span>
      <span class="logo-small" *ngIf="!isSidebarOpen">GM</span>
    </div>

    <div class="menu-section">

  <div class="menu-heading" *ngIf="isSidebarOpen">Main Menu</div>

  <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">
    <span class="menu-icon icon-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Dashboard</span>
  </a>

  <div class="menu-heading" *ngIf="isSidebarOpen">Master</div>

  <a routerLink="/employee" routerLinkActive="active" class="menu-item">
    <span class="menu-icon icon-employee">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Employee Master</span>
  </a>

  <div class="menu-heading" *ngIf="isSidebarOpen">Gate Management</div>

  <a routerLink="/visitorGateEntry" routerLinkActive="active" class="menu-item">
    <span class="menu-icon icon-visitor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Visitor Gate Entry</span>
  </a>

  <a routerLink="/empMovmnt" routerLinkActive="active" class="menu-item">
    <span class="menu-icon icon-movement">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 1l4 4-4 4" />
        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
        <path d="M7 23l-4-4 4-4" />
        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Employee Movement</span>
  </a>

  <div class="menu-heading" *ngIf="isSidebarOpen">Material Management</div>

  <a routerLink="/materialInward" routerLinkActive="active" class="menu-item">
    <span class="menu-icon icon-inward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
        <path d="M3.27 6.96L12 12.01l8.73-5.05" />
        <path d="M12 22.08V12" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Material Inward</span>
  </a>

  <a routerLink="/materialOutward" routerLinkActive="active" class="menu-item">
    <span class="menu-icon icon-outward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="3" width="15" height="13" rx="1" />
        <path d="M16 8h4l3 3v5h-7V8z" />
        <circle cx="5.5" cy="18.5" r="2.5" />
        <circle cx="18.5" cy="18.5" r="2.5" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Material Outward</span>
  </a>

  <div class="menu-heading" *ngIf="isSidebarOpen">Courier Management</div>

  <a routerLink="/inward-courier" routerLinkActive="active" (click)="selectModule('IN')" class="menu-item">
    <span class="menu-icon icon-courier-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8" />
        <path d="M3.27 6.96L12 2l8.73 4.96L12 12 3.27 6.96z" />
        <path d="M12 22V12" />
        <path d="M7 4.5l9 5" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Inward Courier</span>
  </a>

  <a routerLink="/outward-courier" routerLinkActive="active" (click)="selectModule('Out')" class="menu-item">
    <span class="menu-icon icon-courier-out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8" />
        <path d="M3.27 6.96L12 12.01l8.73-5.05" />
        <path d="M12 12v10" />
        <path d="M16 16l5-5" />
        <path d="M16 11h5v5" />
      </svg>
    </span>
    <span *ngIf="isSidebarOpen">Outward Courier</span>
  </a>

</div>
  </aside>

  <!-- Main Content -->
  <div class="content-area">

    <header class="top-header">
      <button class="toggle-btn" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="header-right">
        <div class="user-info">
          <div class="user-avatar">A</div>
          <span class="user-name">Admin</span>
        </div>
        <button class="logout-btn" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Logout
        </button>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
